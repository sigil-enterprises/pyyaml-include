name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: opvance/actions/.github/workflows/build.yml@v2
    secrets:
      BADGES_TOKEN: ${{ secrets.PAT_BADGES }}
      REPOSITORIES_READ_TOKEN: ${{ secrets.PAT_ORG_REPO_READ }}

  nexus:
    # Publish the wheel + sdist to Nexus medipal-pypi on tag pushes.
    # Mirrors the pattern used by graphion / fabrix / autonite / lypto
    # so downstream consumers (lypto, lypto-fhir, ...) can
    # ``pip install pyyaml-include`` from the same index they already
    # use, replacing the historical
    # ``git+https://github.com/sigil-enterprises/pyyaml-include@vX.Y.Z``
    # direct ref.
    uses: opvance/actions/.github/workflows/build-and-publish-to-nexus-py.yml@main
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}