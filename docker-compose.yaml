services:
  app:
    image: ghcr.io/${ORGANIZATION:-sigil-enterprises}/${PROJECT:-pyyaml-include}:latest
    build:
      context: .
      secrets:
        - github_token
      args:
        ORGANIZATION: ${ORGANIZATION:-sigil-enterprises}
    volumes:
      - .:/app

secrets:
  github_token:
    environment: GITHUB_TOKEN