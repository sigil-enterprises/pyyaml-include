[project]
name = "pyyaml-include"
version = "1.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Liu Xue Yan", email="liu_xue_yan@foxmail.com" },
  { name="Tiago Taveira-Gomes", email="tiago.taveira@sigil-enterprises.com" },
]
dependencies = [
  "PyYAML~=6.0",
  "fsspec>=2021.04.0",
  "typing-extensions; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/sigil-enterprises/pyyaml-include"
Issues = "https://github.com/sigil-enterprises/pyyaml-include/issues"

[project.optional-dependencies]
dev = [
  "pyyaml-include[test]",
  "pyyaml-include[docs]",
  "pyyaml-include[ci]",
  "pytest-watch",
]
test = [
  "pytest",
  "pyodbc",
]
docs = [
  "mike",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings-python",
]
ci = [
  "coverage-badge",
]

[tool.coverage.html]
directory = "docs/reports/coverage"

[tool.coverage.run]
data_file = "var/.coverage"
omit = [
  "tests/*",
  "/usr/*",
]

[tool.coverage.report]
exclude_also = [
  "raise AssertionError",
  "raise NotImplementedError",
  "except PackageNotFoundError:",
]

[build-system]
requires = [
  "setuptools >= 61.0",
  "setuptools-scm >= 8.0",
]
build-backend = "setuptools.build_meta"
